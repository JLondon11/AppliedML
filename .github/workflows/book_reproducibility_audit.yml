name: Book reproducibility audit

on:
  push:
    paths:
      - "chapters/**"
      - "book/**"
      - "tools/audit_book_code.py"
      - ".github/workflows/book_reproducibility_audit.yml"
  pull_request:
    paths:
      - "chapters/**"
      - "book/**"
      - "tools/audit_book_code.py"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile all Python source
        run: python -m compileall -q chapters tools
      - name: Static reproducibility audit
        run: python tools/audit_book_code.py --root chapters
      - uses: actions/upload-artifact@v4
        with:
          name: book-code-audit
          path: |
            BOOK_CODE_AUDIT.json
            BOOK_CODE_AUDIT.csv
