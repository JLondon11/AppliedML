name: Chapter 5 KITTI original 3D ground truth single scene PointPillars evaluation
on:
  workflow_dispatch:
  push:
    branches: [chapter5-cpu-sam-validation-20261105]
    paths:
      - .github/workflows/chapter5-kitti-original-3d-gt-local.yml
      - chapters/computer_vision/part_ii/autonomous_vehicles/experiments/pointpillars_kitti_cpu/evaluate_single_scene_original_3d_gt.py
      - chapters/computer_vision/part_ii/autonomous_vehicles/qa/certifications/verify_kitti_original_3d_gt_local.py
permissions:
  actions: read
  contents: read
jobs:
  original-kitti-3d:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy shapely matplotlib
      - name: Compile-check original GT conversion and 3D rotated overlap
        run: python -m py_compile chapters/computer_vision/part_ii/autonomous_vehicles/experiments/pointpillars_kitti_cpu/evaluate_single_scene_original_3d_gt.py
      - name: Restore original pretrained PointPillars output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p gt3d/original_model
          gh run download 42354827106 --repo "${{ github.repository }}" --name chapter5-pointpillars-kitti-singleframe-cpu --dir gt3d/original_model
          (cd gt3d/original_model && zip -q -r ../pointpillars.zip .)
      - name: Obtain trusted original KITTI 3D ground-truth metadata
        run: |
          curl --fail --location --retry 3 -o gt3d/000008.pkl https://raw.githubusercontent.com/open-mmlab/mmdetection3d/main/demo/data/kitti/000008.pkl
      - name: Calculate original-frame 3D rotated box intersection over union against real labels
        run: |
          python chapters/computer_vision/part_ii/autonomous_vehicles/experiments/pointpillars_kitti_cpu/evaluate_single_scene_original_3d_gt.py gt3d/pointpillars.zip gt3d/000008.pkl --out gt3d/scored_results
      - name: Independently verify all measured original KITTI 3D matches
        run: |
          python chapters/computer_vision/part_ii/autonomous_vehicles/qa/certifications/verify_kitti_original_3d_gt_local.py gt3d/scored_results | tee gt3d/scored_results/independent_audit.json
      - name: Archive measured original GT evaluation, no original image or LiDAR redistribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter5-kitti-000008-genuine-3d-gt-versus-pointpillars
          path: gt3d/scored_results/
          if-no-files-found: warn
          retention-days: 90
