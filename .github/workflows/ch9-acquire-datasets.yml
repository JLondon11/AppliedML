name: Chapter 9 public dataset acquisition
on:
  push:
    paths:
      - .github/workflows/ch9-acquire-datasets.yml
      - chapters/nlp_part_ii/experiments/dataset_acquisition/acquire.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install acquisition requirements
        run: python -m pip install -q requests pyarrow 'datasets>=2.19,<5' huggingface_hub
      - name: Download and verify public benchmark datasets
        id: fetch
        run: |
          python chapters/nlp_part_ii/experiments/dataset_acquisition/acquire.py --output acquired --datasets imdb scifact cnn_dailymail_test wmt14
      - name: Archive acquired data, including failures and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter9-public-dataset-acquisition
          path: acquired/
          retention-days: 7
          if-no-files-found: warn
