name: Generate NLP Part II Figure 4

on:
  push:
    paths:
      - "chapters/nlp_part_ii/tokenization_and_representation/figure_04_embedding_geometry/render_figure_04.py"
      - "chapters/nlp_part_ii/tokenization_and_representation/figure_04_embedding_geometry/figure_04_bert_tiny_contextual_vectors.csv"
      - "chapters/nlp_part_ii/tokenization_and_representation/figure_04_embedding_geometry/figure_04_centroid_cosine_distances.csv"
      - "chapters/nlp_part_ii/tokenization_and_representation/figure_04_embedding_geometry/figure_04_model_provenance.json"
      - ".github/workflows/generate_nlp_part_ii_figure_04.yml"
  workflow_dispatch:

concurrency:
  group: nlp-part-ii-figure-04-render
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: git pull --rebase origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install rendering dependencies
        run: pip install "numpy>=1.26,<3" "pandas>=2.2,<3" "matplotlib>=3.8,<4"
      - name: Render Figure 4
        run: python chapters/nlp_part_ii/tokenization_and_representation/figure_04_embedding_geometry/render_figure_04.py
      - name: Commit rendered assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chapters/nlp_part_ii/tokenization_and_representation/figure_04_embedding_geometry/figure_04_embedding_geometry.png
          git add chapters/nlp_part_ii/tokenization_and_representation/figure_04_embedding_geometry/figure_04_embedding_geometry.svg
          if git diff --cached --quiet; then
            echo "No rendered changes."
          else
            git commit -m "Render NLP Part II Figure 4 from validated BERT-Tiny results"
            git push origin main
          fi
