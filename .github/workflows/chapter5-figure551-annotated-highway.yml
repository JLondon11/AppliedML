name: Chapter 5 Figure 5.51 — original annotated TuSimple highway
on:
  workflow_dispatch:
  push:
    branches:
      - chapter5-cpu-sam-validation-20261105
    paths:
      - .github/workflows/chapter5-figure551-annotated-highway.yml
      - chapters/computer_vision/part_ii/autonomous_vehicles/figure_generation/generate_tusimple_actual_highway_551.py
permissions:
  contents: read
jobs:
  figure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install huggingface_hub hf_xet opencv-python-headless numpy matplotlib
      - name: Build Figure 5.51 from matched original TuSimple image and lane annotations
        run: |
          python chapters/computer_vision/part_ii/autonomous_vehicles/figure_generation/generate_tusimple_actual_highway_551.py --output figure_551
      - name: Archive generated figure and documented ground-truth provenance
        uses: actions/upload-artifact@v4
        with:
          name: chapter5-figure551-original-annotated-highway
          path: figure_551/
          if-no-files-found: error
          retention-days: 30
