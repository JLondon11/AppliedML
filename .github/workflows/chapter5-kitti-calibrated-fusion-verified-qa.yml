name: Chapter 5 independent original KITTI camera LiDAR association verification
on:
  workflow_dispatch:
  push:
    branches: [chapter5-cpu-sam-validation-20261105]
    paths:
      - .github/workflows/chapter5-kitti-calibrated-fusion-verified-qa.yml
      - chapters/computer_vision/part_ii/autonomous_vehicles/experiments/kitti_fusion_cpu/verify_original_kitti_late_fusion.py
permissions:
  actions: read
  contents: read
jobs:
  audit-genuine-model-predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy
      - name: Compile full model script and independent prediction verification code
        run: |
          python -m py_compile chapters/computer_vision/part_ii/autonomous_vehicles/experiments/kitti_fusion_cpu/run_late_fusion.py
          python -m py_compile chapters/computer_vision/part_ii/autonomous_vehicles/experiments/kitti_fusion_cpu/verify_original_kitti_late_fusion.py
      - name: Restore original executed real KITTI camera and LiDAR model measurements
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p genuine_sensor_fusion
          gh run download 42356021439 --repo "${{ github.repository }}" --name chapter5-kitti-late-fusion-cpu-measured --dir genuine_sensor_fusion
          (cd genuine_sensor_fusion && zip -q -r ../genuine_sensor_fusion.zip .)
      - name: Independently reproduce every class-aware one-to-one projected detection association
        run: |
          python chapters/computer_vision/part_ii/autonomous_vehicles/experiments/kitti_fusion_cpu/verify_original_kitti_late_fusion.py genuine_sensor_fusion.zip
