name: Chapter 9 Figure 11 measured CPU DDP Transformer candidate
on:
  workflow_dispatch:
  push:
    paths:
      - "chapters/generative_ai_part_ii/code/figure11_real_ddp/experiment.py"
      - ".github/workflows/chapter9_fig11_real_ddp.yml"
permissions:
  contents: write
jobs:
  measured-cpu-ddp:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install execution dependencies
        run: python -m pip install numpy torch scikit-learn matplotlib
      - name: Execute one- and two-rank Transformer distributed training on real digits
        run: |
          OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 python chapters/generative_ai_part_ii/code/figure11_real_ddp/experiment.py \
            --out chapters/generative_ai_part_ii/code/figure11_real_ddp/outputs --epochs 4
      - name: Check real dataset, partition, timings and saved evidence
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          out=Path("chapters/generative_ai_part_ii/code/figure11_real_ddp/outputs")
          m=json.loads((out/"metrics.json").read_text())
          assert m["split_counts"]=={"train":1257,"validation":270,"test":270}
          assert m["split_disjoint"] is True
          assert [w["world_size"] for w in m["world_size_comparisons"]]==[1,2]
          assert len({w["model_parameters"] for w in m["world_size_comparisons"]})==1
          for w in m["world_size_comparisons"]:
              assert 0 <= w["test_accuracy"] <= 1
              assert math.isfinite(w["wall_seconds_max_rank"]) and w["wall_seconds_max_rank"]>0
              assert math.isfinite(w["measured_processed_samples_per_sec"])
              assert w["sampler_padding_duplicates_per_epoch"]>=0
          assert (out/"Figure_011_Distributed_Transformer_Parallelism.png").stat().st_size>1000
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chapter9-figure11-cpu-distributed-transformer-candidate
          path: chapters/generative_ai_part_ii/code/figure11_real_ddp/outputs/
          retention-days: 90
      - name: Commit actual CPU DDP measurements as an uncertified candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f chapters/generative_ai_part_ii/code/figure11_real_ddp/outputs/metrics.json
          git add -f chapters/generative_ai_part_ii/code/figure11_real_ddp/outputs/world_1.json
          git add -f chapters/generative_ai_part_ii/code/figure11_real_ddp/outputs/world_2.json
          git add -f chapters/generative_ai_part_ii/code/figure11_real_ddp/outputs/Figure_011_Distributed_Transformer_Parallelism.png
          git diff --cached --quiet || (git commit -m "Archive measured real-data CPU distributed Transformer Figure 11 candidate" && git pull --rebase origin main && git push origin HEAD:main)
