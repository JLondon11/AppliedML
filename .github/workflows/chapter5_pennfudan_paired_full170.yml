name: Chapter 5 full Penn-Fudan two-model comparison
on:
  workflow_dispatch:
  push:
    branches: [chapter5-cpu-sam-validation-20261105]
    paths:
      - .github/workflows/chapter5_pennfudan_paired_full170.yml
      - chapters/computer_vision/part_ii/autonomous_vehicles/experiments/pennfudan_two_model_comparison/**
permissions:
  contents: read
jobs:
  paired-models:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pillow numpy matplotlib
      - name: Execute both genuine pretrained networks on all 170 original annotated Penn-Fudan photographs
        run: |
          python chapters/computer_vision/part_ii/autonomous_vehicles/experiments/pennfudan_two_model_comparison/compare.py --out full170_paired_results --score 0.01
      - name: Archive derived measurements and scientific figure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter5-pennfudan-full170-two-model-comparison
          path: full170_paired_results/
          if-no-files-found: warn
          retention-days: 90
