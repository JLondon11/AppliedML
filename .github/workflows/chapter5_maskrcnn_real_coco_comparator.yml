name: Chapter 5 trained Mask R-CNN matched COCO comparator

on:
  push:
    paths:
      - '.github/workflows/chapter5_maskrcnn_real_coco_comparator.yml'
      - 'chapters/computer_vision/part_ii/autonomous_vehicles/case_studies/segment_anything/prepare_real_coco_subset.py'
      - 'chapters/computer_vision/part_ii/autonomous_vehicles/case_studies/segment_anything/evaluate_maskrcnn_coco_same_scene.py'
  workflow_dispatch:

jobs:
  real-original-sam-coco:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and original SAM code
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install numpy matplotlib opencv-python-headless pycocotools
          python -m pip install git+https://github.com/facebookresearch/segment-anything.git
      - name: Obtain original COCO 2017 images and annotations
        run: |
          mkdir -p /tmp/ch5_sam/source /tmp/ch5_sam/weights
          curl --fail --location --retry 3 --output /tmp/ch5_sam/source/annotations_trainval2017.zip \
            https://huggingface.co/datasets/pcuenq/coco-2017-mirror/resolve/5200d2cffae8121713bec767b4693bdafc0eeb0b/annotations_trainval2017.zip
          curl --fail --location --retry 3 --output /tmp/ch5_sam/source/val2017.zip \
            https://huggingface.co/datasets/pcuenq/coco-2017-mirror/resolve/5200d2cffae8121713bec767b4693bdafc0eeb0b/val2017.zip
          echo '113a836d90195ee1f884e704da6304dfaaecff1f023f49b6ca93c4aaae470268  /tmp/ch5_sam/source/annotations_trainval2017.zip' | sha256sum --check
          echo '4f7e2ccb2866ec5041993c9cf2a952bbed69647b115d0f74da7ce8f4bef82f05  /tmp/ch5_sam/source/val2017.zip' | sha256sum --check
          unzip -q /tmp/ch5_sam/source/annotations_trainval2017.zip \
            annotations/instances_val2017.json -d /tmp/ch5_sam/source
      - name: Select and download original annotated COCO photographs
        run: |
          python chapters/computer_vision/part_ii/autonomous_vehicles/case_studies/segment_anything/prepare_real_coco_subset.py \
            --original-json /tmp/ch5_sam/source/annotations/instances_val2017.json \
            --output-dir /tmp/ch5_sam/subset --count 18 --seed 20261104 \
            --original-image-zip /tmp/ch5_sam/source/val2017.zip
          test -s /tmp/ch5_sam/subset/instances_subset.json
      - name: Run pretrained Mask R-CNN on same original COCO photographs
        run: |
          python chapters/computer_vision/part_ii/autonomous_vehicles/case_studies/segment_anything/evaluate_maskrcnn_coco_same_scene.py \
            --coco-json /tmp/ch5_sam/subset/instances_subset.json \
            --images /tmp/ch5_sam/subset --output /tmp/ch5_sam/results \
            --max-objects 64 --max-plots 8 --min-box-area 3000 \
            --score-min .05
          cp /tmp/ch5_sam/subset/selection_provenance.json /tmp/ch5_sam/results/
          test -s /tmp/ch5_sam/results/per_object_metrics.csv
          test -s /tmp/ch5_sam/results/metrics_summary.json
      - name: Upload genuine pretrained Mask R-CNN predictions and results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chapter5-maskrcnn-COCO-matched-18-images
          path: /tmp/ch5_sam/results/
          retention-days: 90
