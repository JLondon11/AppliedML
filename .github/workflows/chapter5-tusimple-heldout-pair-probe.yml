name: Chapter 5 — TuSimple heldout exact image annotation pairing
on:
  workflow_dispatch:
  push:
    branches: [chapter5-cpu-sam-validation-20261105]
    paths:
      - .github/workflows/chapter5-tusimple-heldout-pair-probe.yml
      - chapters/computer_vision/part_ii/autonomous_vehicles/experiments/tusimple_unet_cpu/probe_test_pairs.py
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install huggingface_hub
      - run: python chapters/computer_vision/part_ii/autonomous_vehicles/experiments/tusimple_unet_cpu/probe_test_pairs.py
