name: Chapter 9 pretrained summarization and translation pilots
on:
  push:
    paths:
      - .github/workflows/ch9-seq2seq-pilots.yml
      - chapters/nlp_part_ii/experiments/seq2seq_evaluation/run.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: summarization
            limit: 32
          - task: translation
            limit: 128
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model and evaluation dependencies
        run: |
          python -m pip install --quiet 'transformers==4.44.2' 'datasets==2.21.0' 'torch>=2.2,<3' 'numpy<3' 'matplotlib>=3.8,<4' 'sacrebleu>=2.4,<3' 'rouge-score>=0.1.2,<1' 'sentencepiece>=0.2,<1' protobuf
      - name: Execute real pretrained model on official test subset
        env:
          OMP_NUM_THREADS: '3'
          OPENBLAS_NUM_THREADS: '2'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python chapters/nlp_part_ii/experiments/seq2seq_evaluation/run.py --task ${{ matrix.task }} --max-examples ${{ matrix.limit }} --batch-size 2 --num-beams 2 --max-new-tokens 96 --output results/${{ matrix.task }}
      - name: Save measured predictions and outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter9-${{ matrix.task }}-sampled-transformer-results
          path: results/
          if-no-files-found: warn
          retention-days: 7
