name: Generate Chapter 1 CWRU Predictive Maintenance Figure

on:
  push:
    branches:
      - book-publication-recovery-final
    paths:
      - 'book/final/01_Foundations_of_Machine_Learning/code/figures/generate_predictive_maintenance_cwru.py'
      - '.github/workflows/ch01-cwru-predictive-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ch01-cwru-predictive-maintenance
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: book-publication-recovery-final
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas matplotlib scipy scikit-learn
      - name: Sync latest publication branch
        run: |
          git pull --ff-only origin book-publication-recovery-final
      - name: Generate real-data CWRU evidence
        run: |
          python book/final/01_Foundations_of_Machine_Learning/code/figures/generate_predictive_maintenance_cwru.py
      - name: Commit generated assets
        run: |
          git config user.name "AppliedML Publication Bot"
          git config user.email "actions@users.noreply.github.com"
          git add book/final/01_Foundations_of_Machine_Learning/figures/figure_01_24_predictive_maintenance_cwru.*                   book/final/01_Foundations_of_Machine_Learning/figures/ch01_predictive_maintenance_benchmark.csv                   book/final/01_Foundations_of_Machine_Learning/figures/ch01_predictive_maintenance_provenance.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Generate real CWRU predictive-maintenance evidence"
          for attempt in 1 2 3 4; do
            git pull --rebase origin book-publication-recovery-final
            if git push origin HEAD:book-publication-recovery-final; then
              break
            fi
            sleep 2
          done
