name: Reconstruct Recovered Chapter TeX Sources

on:
  push:
    branches:
      - book-publication-recovery-final
    paths:
      - 'book/recovery/pass16_baseline/staging/*.b64.part*'
      - '.github/workflows/reconstruct-recovered-chapter-tex.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: book-publication-recovery-final
          fetch-depth: 0
      - name: Reconstruct .tex sources from committed chunks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p book/recovery/pass16_baseline/tex
          shopt -s nullglob
          prefixes=()
          for part in book/recovery/pass16_baseline/staging/*.tex.gz.b64.part*; do
            prefix="${part%.part*}"
            if [[ ! " ${prefixes[*]} " =~ " ${prefix} " ]]; then
              prefixes+=("$prefix")
            fi
          done
          for prefix in "${prefixes[@]}"; do
            stem="$(basename "${prefix%.gz.b64}")"
            cat "${prefix}".part* > "/tmp/${stem}.gz.b64"
            base64 -d "/tmp/${stem}.gz.b64" > "/tmp/${stem}.gz"
            gzip -dc "/tmp/${stem}.gz" > "book/recovery/pass16_baseline/tex/${stem}"
          done
      - name: Commit reconstructed sources
        shell: bash
        run: |
          if git status --porcelain | grep -q .; then
            git config user.name "AppliedML Publication Bot"
            git config user.email "actions@users.noreply.github.com"
            git add book/recovery/pass16_baseline/tex
            git commit -m "Reconstruct recovered chapter TeX baselines"
            git pull --rebase origin book-publication-recovery-final
            git push origin HEAD:book-publication-recovery-final
          fi
