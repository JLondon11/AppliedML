name: Chapter 9 financial QA dataset acquisition
on:
  push:
    paths:
      - .github/workflows/ch9-financial-datasets.yml
      - chapters/nlp_part_ii/experiments/dataset_acquisition/acquire_financial.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install downloader requirements
        run: python -m pip install requests
      - name: Download and validate FinQA / TAT-QA
        run: python chapters/nlp_part_ii/experiments/dataset_acquisition/acquire_financial.py --output acquired_financial
      - name: Save datasets, manifests, and failed acquisitions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter9-financial-qa-datasets
          path: acquired_financial/
          if-no-files-found: warn
          retention-days: 7
