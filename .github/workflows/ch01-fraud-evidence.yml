name: Generate Chapter 1 Fraud Evidence

on:
  push:
    branches:
      - book-publication-recovery-final
    paths:
      - 'book/final/01_Foundations_of_Machine_Learning/code/generate_credit_card_fraud_evidence.py'
      - '.github/workflows/ch01-fraud-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: book-publication-recovery-final
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas matplotlib scikit-learn
      - name: Generate fraud benchmark assets
        run: |
          python book/final/01_Foundations_of_Machine_Learning/code/generate_credit_card_fraud_evidence.py
      - name: Commit generated evidence
        run: |
          if git status --porcelain | grep -q .; then
            git config user.name "AppliedML Publication Bot"
            git config user.email "actions@users.noreply.github.com"
            git add book/final/01_Foundations_of_Machine_Learning
            git commit -m "Generate Chapter 1 fraud evidence assets"
            git pull --rebase origin book-publication-recovery-final
            git push origin HEAD:book-publication-recovery-final
          fi
