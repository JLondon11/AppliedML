name: Generate Chapter 1 Real-Data Application Figures

on:
  push:
    branches:
      - book-publication-recovery-final
    paths:
      - 'book/final/01_Foundations_of_Machine_Learning/code/figures/generate_predictive_maintenance_cwru.py'
      - 'book/final/01_Foundations_of_Machine_Learning/code/figures/generate_smart_grid_uci_power.py'
      - 'book/final/01_Foundations_of_Machine_Learning/code/figures/generate_governance_adult_audit.py'
      - '.github/workflows/ch01-real-data-application-figures.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: book-publication-recovery-final
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas matplotlib scipy scikit-learn
      - name: Generate CWRU predictive-maintenance evidence
        run: |
          python book/final/01_Foundations_of_Machine_Learning/code/figures/generate_predictive_maintenance_cwru.py
      - name: Generate UCI smart-grid evidence
        run: |
          python book/final/01_Foundations_of_Machine_Learning/code/figures/generate_smart_grid_uci_power.py
      - name: Generate UCI Adult governance audit
        run: |
          python book/final/01_Foundations_of_Machine_Learning/code/figures/generate_governance_adult_audit.py
      - name: Commit generated evidence
        run: |
          if git status --porcelain | grep -q .; then
            git config user.name "AppliedML Publication Bot"
            git config user.email "actions@users.noreply.github.com"
            git add book/final/01_Foundations_of_Machine_Learning/figures
            git commit -m "Generate Chapter 1 real-data application evidence"
            git pull --rebase origin book-publication-recovery-final
            git push origin HEAD:book-publication-recovery-final
          fi
