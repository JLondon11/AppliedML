name: Chapter 5 — CPU CrowdHuman genuine pedestrian inference
on:
  workflow_dispatch:
  push:
    branches:
      - chapter5-cpu-sam-validation-20261105
    paths:
      - ".github/workflows/chapter5-crowdhuman-cpu.yml"
      - "chapters/computer_vision/part_ii/autonomous_vehicles/experiments/crowdhuman_cpu/**"
      - "chapters/computer_vision/part_ii/autonomous_vehicles/case_studies/occluded_pedestrian_detection/evaluate_crowdhuman_frcnn.py"
permissions:
  contents: read
jobs:
  crowdhuman-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install huggingface_hub opencv-python-headless numpy matplotlib
      - name: Prepare licensed original validation samples and genuine weights
        run: |
          python chapters/computer_vision/part_ii/autonomous_vehicles/experiments/crowdhuman_cpu/prepare.py \
            --out "${{ runner.temp }}/crowdhuman" --images 96 --seed 20261106
      - name: Execute pretrained Faster R-CNN on real CrowdHuman photographs
        run: |
          python chapters/computer_vision/part_ii/autonomous_vehicles/case_studies/occluded_pedestrian_detection/evaluate_crowdhuman_frcnn.py \
            --image-dir "${{ runner.temp }}/crowdhuman/images" \
            --annotations-odgt "${{ runner.temp }}/crowdhuman/subset.odgt" \
            --checkpoint "${{ runner.temp }}/crowdhuman/fasterrcnn_resnet50_fpn_coco_state_dict.pth" \
            --output crowdhuman_results --max-images 96
      - name: Plot measured local recall against annotation occlusion proxy
        run: |
          python chapters/computer_vision/part_ii/autonomous_vehicles/experiments/crowdhuman_cpu/plot_results.py \
            --csv crowdhuman_results/recall_by_occlusion.csv --out crowdhuman_results
      - name: Remove original copyrighted photographs from publishable artifacts
        if: always()
        run: rm -rf crowdhuman_results/figures
      - name: Upload measured statistics and scientific plots only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter5-crowdhuman-cpu-measured-evidence
          path: crowdhuman_results/
          if-no-files-found: warn
          retention-days: 30
