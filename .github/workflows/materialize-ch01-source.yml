name: Materialize Chapter 1 Integrated Source

on:
  push:
    branches:
      - book-publication-recovery-final
    paths:
      - 'book/final/01_Foundations_of_Machine_Learning/source/chapter_01_foundations_of_machine_learning_integrated.tex.gz'
      - '.github/workflows/materialize-ch01-source.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-ch01-source
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: book-publication-recovery-final
      - name: Materialize and verify Chapter 1 source
        shell: bash
        run: |
          set -euo pipefail
          base='book/final/01_Foundations_of_Machine_Learning'
          gz="$base/source/chapter_01_foundations_of_machine_learning_integrated.tex.gz"
          dst="$base/chapter_01_foundations_of_machine_learning.tex"
          test -s "$gz"
          gzip -t "$gz"
          gzip -cd "$gz" > "$dst"
          test -s "$dst"
          echo "Integrated source artifact:"
          sha256sum "$gz"
          echo "Materialized editable TeX:"
          sha256sum "$dst"
          grep -q '\\section{Introduction}' "$dst"
          grep -q '\\section{End-of-Chapter Problems}' "$dst"
      - name: Commit editable Chapter 1 TeX
        shell: bash
        run: |
          set -euo pipefail
          if git status --porcelain -- book/final/01_Foundations_of_Machine_Learning/chapter_01_foundations_of_machine_learning.tex | grep -q .; then
            git config user.name "AppliedML Publication Bot"
            git config user.email "actions@users.noreply.github.com"
            git add book/final/01_Foundations_of_Machine_Learning/chapter_01_foundations_of_machine_learning.tex
            git commit -m "Materialize integrated Chapter 1 editable TeX"
            for attempt in 1 2 3 4; do
              git pull --rebase origin book-publication-recovery-final
              if git push origin HEAD:book-publication-recovery-final; then
                break
              fi
              sleep 2
            done
          fi
