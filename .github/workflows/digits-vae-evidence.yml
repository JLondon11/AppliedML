name: Scientific evidence — digits VAE DDPM DDIM quality
on:
  workflow_dispatch:
  push:
    paths:
      - "chapters/generative_ai_part_i/figure_generation/pass12/**"
      - "tools/scientific_qa/**"
      - ".github/workflows/digits-vae-evidence.yml"
  pull_request:
    paths:
      - "chapters/generative_ai_part_i/figure_generation/pass12/**"
      - "tools/scientific_qa/**"
      - ".github/workflows/digits-vae-evidence.yml"

jobs:
  run-digits-vae:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install experimental dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scikit-learn matplotlib torch
      - name: Validate figure provenance
        run: |
          python tools/scientific_qa/validate_provenance.py --require-real-data chapters/generative_ai_part_i/figure_generation/pass12/provenance.json
          python -m unittest discover -s tools/scientific_qa -p 'test_*.py'
      - name: Execute real-data VAE
        run: |
          python chapters/generative_ai_part_i/figure_generation/pass12/generate_pass12_figures.py
      - name: Execute matched DDPM and DDIM comparison
        run: |
          python chapters/generative_ai_part_i/figure_generation/pass12/ddim_ddpm_comparison.py \
            --checkpoint chapters/generative_ai_part_i/figure_generation/pass12/outputs/ddpm/best_ddpm.pt \
            --out chapters/generative_ai_part_i/figure_generation/pass12/outputs/ddim_comparison
      - name: Evaluate classifier-feature quality on real digits
        run: |
          OPENBLAS_NUM_THREADS=1 python chapters/generative_ai_part_i/figure_generation/pass12/quality_benchmark.py \
            --checkpoint chapters/generative_ai_part_i/figure_generation/pass12/outputs/ddpm/best_ddpm.pt \
            --out chapters/generative_ai_part_i/figure_generation/pass12/outputs/quality
      - name: Verify evidence structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("chapters/generative_ai_part_i/figure_generation/pass12/outputs")
          m = json.loads((p / "metrics.json").read_text())
          assert m["dataset_samples"] == 1797
          assert m["train_samples"] == 1347
          assert m["validation_samples"] == 450
          assert m["test_samples"] == 0
          assert 0 <= m["validation_latent_10nn_purity_mean"] <= 1
          d = json.loads((p / "ddpm" / "metrics.json").read_text())
          assert (d["training_count"], d["validation_count"], d["test_count"]) == (1257, 270, 270)
          assert d["independent_test_mean_epsilon_mse"] < d["independent_test_baseline_mean_epsilon_mse"]
          assert d["checkpoint_epoch_selected_by_validation"] <= d["epochs_run"]
          comparison = json.loads((p/"ddim_comparison"/"comparison_metrics.json").read_text())
          assert comparison["train"] == 1257 and comparison["test"] == 270
          assert comparison["ddim_eta"] == 0.0
          quality = json.loads((p/"quality"/"quality_metrics.json").read_text())
          assert quality["split"] == {"training":1257,"validation":270,"independent_test":270}
          assert quality["independent_test_digit_classification_accuracy"] > .90
          assert len(quality["metrics"]) == 4
          for fname in ("quality_per_seed.csv","quality_diagnostics.png"):
              assert (p/"quality"/fname).stat().st_size > 0
          assert set(comparison["summary"]) == {"DDPM-100","DDIM-100","DDIM-50","DDIM-20"}
          for name in ("comparison_metrics.csv", "ddpm_ddim_real_digits.png", "ddpm_ddim_diagnostics.png"):
              assert (p/"ddim_comparison"/name).stat().st_size > 0
          for name in ("history.csv", "validation_embeddings.csv", "vae_validation.png", "vae_interpolation.png", "vae_model.pt", "replacement_metrics.json", "replacement_measurements.csv", "denoiser_model.pt", "figure_03.png", "figure_10.png", "figure_11.png", "figure_14.png", "figure_20.png", "figure_24.png", "ddpm/metrics.json", "ddpm/best_ddpm.pt", "ddpm/ddpm_generated_samples.png", "ddpm/ddpm_test_metrics.png", "ddpm/real_test_digits.png", "ddpm/test_metrics.csv", "ddpm/training_history.csv"):
              assert (p / name).stat().st_size > 0
          print("Evidence structure validated; DDPM independent test metrics verified. Image-quality certification remains pending.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: digits-vae-and-ddpm-measured-evidence
          path: chapters/generative_ai_part_i/figure_generation/pass12/outputs/
          retention-days: 30
