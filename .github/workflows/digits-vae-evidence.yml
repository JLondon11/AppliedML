name: Scientific evidence — digits VAE
on:
  workflow_dispatch:
  push:
    paths:
      - "chapters/generative_ai_part_i/figure_generation/pass12/**"
      - "tools/scientific_qa/**"
      - ".github/workflows/digits-vae-evidence.yml"
  pull_request:
    paths:
      - "chapters/generative_ai_part_i/figure_generation/pass12/**"
      - "tools/scientific_qa/**"
      - ".github/workflows/digits-vae-evidence.yml"

jobs:
  run-digits-vae:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install experimental dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scikit-learn matplotlib torch
      - name: Validate figure provenance
        run: |
          python tools/scientific_qa/validate_provenance.py chapters/generative_ai_part_i/figure_generation/pass12/provenance.json
          python -m unittest discover -s tools/scientific_qa -p 'test_*.py'
      - name: Execute real-data VAE
        run: |
          python chapters/generative_ai_part_i/figure_generation/pass12/run_vae_evidence.py --out outputs/vae_audit
      - name: Verify evidence structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("outputs/vae_audit")
          m = json.loads((p / "metrics.json").read_text())
          assert m["dataset_samples"] == 1797
          assert m["train_samples"] == 1347
          assert m["validation_samples"] == 450
          assert m["test_samples"] == 0
          assert 0 <= m["validation_latent_10nn_purity_mean"] <= 1
          for name in ("history.csv", "validation_embeddings.csv", "vae_validation.png", "vae_interpolation.png", "vae_model.pt"):
              assert (p / name).stat().st_size > 0
          print("Evidence structure validated; independent test certification remains pending.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: digits-vae-measured-evidence
          path: outputs/vae_audit/
          retention-days: 30
