name: Chapter 9 full CNN DailyMail Lead-3 benchmark
on:
  push:
    paths:
      - .github/workflows/ch9-cnn-lead3-full.yml
      - chapters/nlp_part_ii/experiments/summarization_lead3/run.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install data and scoring dependencies
        run: |
          python -m pip install --quiet 'datasets==2.21.0' 'rouge-score>=0.1.2,<1' numpy matplotlib
      - name: Execute Lead-3 on all official test articles
        env:
          OPENBLAS_NUM_THREADS: '2'
        run: |
          python chapters/nlp_part_ii/experiments/summarization_lead3/run.py --output results/lead3_full
      - name: Save complete predictions and real figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter9-cnn-lead3-full-11490
          path: results/
          if-no-files-found: warn
          retention-days: 7
