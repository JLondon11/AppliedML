name: Chapter 2 Pass 2 real-data case-study verification
on:
  push:
    paths:
      - 'chapters/deep_learning/part_i/experiments/pass2_real_digits_diabetes/**'
      - '.github/workflows/chapter2_pass2_real_digits_diabetes.yml'
  pull_request:
    paths:
      - 'chapters/deep_learning/part_i/experiments/pass2_real_digits_diabetes/**'
      - '.github/workflows/chapter2_pass2_real_digits_diabetes.yml'
  workflow_dispatch:
jobs:
  scientific-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install scientific dependencies
        run: python -m pip install 'numpy>=2,<3' 'scipy>=1.14,<2' 'scikit-learn>=1.6,<2' 'matplotlib>=3.9,<4'
      - name: Execute original observed-data studies and regenerate all figures
        run: |
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python chapters/deep_learning/part_i/experiments/pass2_real_digits_diabetes/run.py --output ch2_pass2_measured
      - name: Verify original data hashes and all real prediction metrics
        run: |
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python chapters/deep_learning/part_i/experiments/pass2_real_digits_diabetes/test_outputs.py ch2_pass2_measured
      - name: Publish research evidence and publication-ready figures
        uses: actions/upload-artifact@v4
        with:
          name: chapter2-pass2-real-digits-diabetes-figures-231-234
          path: ch2_pass2_measured/
          if-no-files-found: error
