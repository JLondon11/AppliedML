name: Generate NLP Part II Figure 12
on:
  push:
    paths:
      - "chapters/nlp_part_ii/case_studies/enterprise_rag/figure_12_hallucination_comparison/render_figure_12.py"
      - "chapters/nlp_part_ii/case_studies/enterprise_rag/figure_12_hallucination_comparison/figure_12_claim_level_results.csv"
      - "chapters/nlp_part_ii/case_studies/enterprise_rag/figure_12_hallucination_comparison/figure_12_metrics.json"
      - ".github/workflows/generate_nlp_part_ii_figure_12.yml"
  workflow_dispatch:

concurrency:
  group: nlp-part-ii-figure-12-render
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Sync latest main
        run: git pull --rebase origin main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install rendering dependencies
        run: pip install "numpy>=1.26,<3" "pandas>=2.2,<3" "matplotlib>=3.8,<4"

      - name: Render Figure 12 from stored experiment results
        run: python chapters/nlp_part_ii/case_studies/enterprise_rag/figure_12_hallucination_comparison/render_figure_12.py

      - name: Commit rendered assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chapters/nlp_part_ii/case_studies/enterprise_rag/figure_12_hallucination_comparison/figure_12_hallucination_reduction_rag.png
          git add chapters/nlp_part_ii/case_studies/enterprise_rag/figure_12_hallucination_comparison/figure_12_hallucination_reduction_rag.svg
          if git diff --cached --quiet; then
            echo "No rendered changes"
          else
            git commit -m "Render NLP Part II Figure 12 from stored SciFact results"
            git push origin main
          fi
