name: Generate Scientific AI Figure 14
on:
  push:
    paths:
      - "chapters/scientific_ai/ophthalmology/figure_14_gradcam_retinal_application/figure_14_gradcam_retinal.py"
      - ".github/workflows/generate_scientific_ai_figure_14.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install "torch>=2.2,<3" "torchvision>=0.17,<1" "medmnist>=3.0,<4" "numpy>=1.26,<3" "pandas>=2.2,<3" "matplotlib>=3.8,<4"
      - run: python chapters/scientific_ai/ophthalmology/figure_14_gradcam_retinal_application/figure_14_gradcam_retinal.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chapters/scientific_ai/ophthalmology/figure_14_gradcam_retinal_application/
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Generate Scientific AI Figure 14 from RetinaMNIST Grad-CAM experiment"; git push; fi