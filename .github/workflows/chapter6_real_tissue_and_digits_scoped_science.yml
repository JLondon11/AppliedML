name: Chapter 6 original tissue and digit-model evidence
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/chapter6_real_tissue_and_digits_scoped_science.yml'
      - 'chapters/generative_ai_part_i/code/section_6_medical_imaging_histology_vae/**'
      - 'chapters/generative_ai_part_i/code/section_6_20_1_latent_diffusion_digits/**'
      - 'chapters/generative_ai_part_i/qa/CH6_SCOPED_SCIENTIFIC_VS_PRODUCTION_REGISTER_20261113.csv'
      - 'chapters/generative_ai_part_i/qa/validate_scoped_ch6_certifications.py'
permissions:
  contents: read
jobs:
  tissue-original-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original data and model dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'torch>=2.3,<3' 'scikit-image>=0.22,<0.27' 'matplotlib>=3.8,<4'
      - name: Rerun genuine single-immunohistochemistry-image spatially disjoint experiment
        shell: bash
        run: |
          set -euo pipefail
          D=chapters/generative_ai_part_i/code/section_6_medical_imaging_histology_vae
          python "$D/run.py" --epochs 12 --output "$RUNNER_TEMP/original_tissue"
          mkdir -p "$D/results"
          cp -a "$RUNNER_TEMP/original_tissue/." "$D/results/"
          python "$D/test_outputs.py"
          python "$D/plot_original_tissue_patch_errors.py" \
            --results "$RUNNER_TEMP/original_tissue" --output "$RUNNER_TEMP/original_tissue_figures"
          test -s "$RUNNER_TEMP/original_tissue_figures/original_tissue_cvae_spatial_error.pdf"
          test -s "$RUNNER_TEMP/original_tissue_figures/original_tissue_cvae_spatial_error.svg"
      - uses: actions/upload-artifact@v4
        with:
          name: chapter6-original-tissue-217-real-patches-scoped-experiment
          path: |
            ${{ runner.temp }}/original_tissue
            ${{ runner.temp }}/original_tissue_figures
          retention-days: 90
  digit-original-generator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real-digit data and neural-network dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'torch>=2.3,<3' 'scikit-learn>=1.3,<2' 'matplotlib>=3.8,<4'
      - name: Rerun original digit VAE and label-conditional latent diffusion
        shell: bash
        run: |
          set -euo pipefail
          D=chapters/generative_ai_part_i/code/section_6_20_1_latent_diffusion_digits
          python "$D/run.py" --vae-epochs 25 --diffusion-epochs 35 --output "$RUNNER_TEMP/original_digits"
          mkdir -p "$D/results"
          cp -a "$RUNNER_TEMP/original_digits/." "$D/results/"
          python "$D/test_outputs.py"
          python "$D/figure_6_44_publication.py" \
            --predictions "$RUNNER_TEMP/original_digits/predictions.csv" \
            --output "$RUNNER_TEMP/original_digit_figures"
          test -s "$RUNNER_TEMP/original_digit_figures/Figure6_44_Classwise_Consistency.pdf"
          python "$D/plot_verified_original_class_counts.py" \\
            --source "$D/figure_6_44_class_counts_pass27.csv" \\
            --output "$RUNNER_TEMP/original_digit_figures"
          test -s "$RUNNER_TEMP/original_digit_figures/original_digit_classwise_scientific.png"
      - uses: actions/upload-artifact@v4
        with:
          name: chapter6-real-scanned-digits-class-conditional-model-evidence
          path: |
            ${{ runner.temp }}/original_digits
            ${{ runner.temp }}/original_digit_figures
          retention-days: 90
