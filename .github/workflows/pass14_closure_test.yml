name: Pass14 closure test
on:
  push:
    paths:
      - '.github/workflows/pass14_closure_test.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p artifact
          echo 'github runner closure test' > artifact/test.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pass14-closure-test
          path: artifact/
