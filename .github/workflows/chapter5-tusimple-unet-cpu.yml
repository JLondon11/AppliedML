name: Chapter 5 — CPU real TuSimple pretrained U-Net inference
on:
  workflow_dispatch:
  push:
    branches:
      - chapter5-cpu-sam-validation-20261105
    paths:
      - .github/workflows/chapter5-tusimple-unet-cpu.yml
      - chapters/computer_vision/part_ii/autonomous_vehicles/experiments/tusimple_unet_cpu/**
permissions:
  contents: read
jobs:
  tusimple-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KERAS_BACKEND: torch
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact CPU execution dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "keras>=3.4,<4" huggingface_hub hf_xet numpy opencv-python-headless matplotlib h5py
      - name: Execute actual TuSimple trained model on original labeled images
        run: |
          python chapters/computer_vision/part_ii/autonomous_vehicles/experiments/tusimple_unet_cpu/evaluate.py \
            --out tusimple_measured --images 12 --seed 20261106
      - name: Plot measured per-frame overlap
        run: |
          python chapters/computer_vision/part_ii/autonomous_vehicles/experiments/tusimple_unet_cpu/plot.py \
            --csv tusimple_measured/per_frame.csv --out tusimple_measured
      - name: Exclude original copyrighted road imagery from artifacts
        if: always()
        run: rm -f tusimple_measured/prediction_*.png
      - name: Upload real numerical evidence and scientific plots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter5-tusimple-pretrained-unet-real-inference
          path: tusimple_measured/
          if-no-files-found: warn
          retention-days: 30
