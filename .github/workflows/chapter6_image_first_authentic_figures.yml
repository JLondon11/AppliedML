name: Chapter 6 authentic image-first figures and executed tissue VAE
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/chapter6_image_first_authentic_figures.yml'
      - 'chapters/generative_ai_part_i/figure_generation/original_source_image_plates/**'
      - 'chapters/generative_ai_part_i/code/section_6_medical_imaging_histology_vae/**'
      - 'chapters/generative_ai_part_i/qa/verify_pass62_paired_measured_records.py'
      - 'chapters/generative_ai_part_i/qa/audit_print_scaled_figures.py'
      - 'chapters/generative_ai_part_i/qa/validate_pass63_print_figures.py'
      - 'chapters/generative_ai_part_i/figure_generation/print_width_original_image_portfolio.py'
      - 'chapters/generative_ai_part_i/figure_generation/print_width_architecture_plates.py'
      - 'chapters/generative_ai_part_i/code/section_6_molecular_smiles_vae/make_original_nci_structure_plate.py'
      - 'chapters/generative_ai_part_i/code/section_6_molecular_smiles_vae/plot_nci_smiles_vae_code_architecture.py'
permissions:
  contents: read
jobs:
  original-image-plates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source data and image-publishing libraries
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scikit-image>=0.22,<0.27' 'scikit-learn>=1.4,<2' 'matplotlib>=3.8,<4' 'pymupdf>=1.24,<2'
      - name: Produce original, nonsimulated photographed/source-image plates
        shell: bash
        run: |
          set -euo pipefail
          S=chapters/generative_ai_part_i/figure_generation/original_source_image_plates
          python "$S/make_authentic_source_image_plates.py"
          for n in original_tissue_source_and_patches original_scanned_digits_gallery; do
            test -s "$S/$n.pdf"
            test -s "$S/$n.png"
            test -s "$S/$n.svg"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('chapters/generative_ai_part_i/figure_generation/original_source_image_plates/source_image_plate_provenance.json')
          d=json.loads(p.read_text())
          assert d['tissue_source_pixel_sha256']=='c5b3ef509a92f16d4c29be8cf0300fe75d53e13a3ce650159db932caea8dcc1b'
          assert d['digit_source_sample_count']==1797
          assert d['actual_source_not_model_generated'] is True
          print('PASS original image sources, image-first figures and non-generated labeling')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chapter6-authentic-microscopy-and-scanned-digit-source-image-plates
          path: |
            chapters/generative_ai_part_i/figure_generation/original_source_image_plates/*.pdf
            chapters/generative_ai_part_i/figure_generation/original_source_image_plates/*.png
            chapters/generative_ai_part_i/figure_generation/original_source_image_plates/*.svg
            chapters/generative_ai_part_i/figure_generation/original_source_image_plates/*.json
          retention-days: 90
  actual-tissue-model-output-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native tensor network and measured image data
        run: python -m pip install --disable-pip-version-check 'torch>=2.3,<3' 'numpy>=1.26,<3' 'scikit-image>=0.22,<0.27' 'matplotlib>=3.8,<4' 'pymupdf>=1.24,<2'
      - name: Generate code-faithful scientific tissue convolutional VAE architecture
        shell: bash
        run: |
          set -euo pipefail
          D=chapters/generative_ai_part_i/code/section_6_medical_imaging_histology_vae
          python "$D/plot_tissue_vae_code_architecture.py" --output "$RUNNER_TEMP/tissue_vae_architecture"
          test -s "$RUNNER_TEMP/tissue_vae_architecture/tissue_convolutional_vae_code_architecture.pdf"
          test -s "$RUNNER_TEMP/tissue_vae_architecture/tissue_convolutional_vae_code_architecture.svg"
          python - <<'PY'
          from pathlib import Path
          import fitz,os
          p=Path(os.environ['RUNNER_TEMP'])/'tissue_vae_architecture/tissue_convolutional_vae_code_architecture.pdf'
          d=fitz.open(p)
          assert len(d)==1
          text=d[0].get_text()
          for term in ('Conv encoder','Transposed-convolution decoder','24 components'):
              assert term in text,term
          print('PASS original source-aligned tissue 24-latent convolutional VAE topology')
          PY
      - name: Execute 12-epoch VAE on original immunohistochemistry photo
        shell: bash
        run: |
          set -euo pipefail
          D=chapters/generative_ai_part_i/code/section_6_medical_imaging_histology_vae
          python "$D/run.py" --epochs 12 --output "$RUNNER_TEMP/original_tissue"
          python "$D/plot_tissue_original_model_outputs.py" \
            --checkpoint "$RUNNER_TEMP/original_tissue/tissue_vae.pt" \
            --output "$RUNNER_TEMP/original_tissue_qualitative"
          test -s "$RUNNER_TEMP/original_tissue_qualitative/actual_tissue_cvae_reconstruction_gallery.pdf"
          python "$D/audit_true_tissue_vae_vs_nearest.py" \
            --checkpoint "$RUNNER_TEMP/original_tissue/tissue_vae.pt" \
            --output "$RUNNER_TEMP/real_tissue_paired_diagnostic"
          test -s "$RUNNER_TEMP/real_tissue_paired_diagnostic/actual_tissue_paired_failure_success_atlas.pdf"
          python "$D/make_print_ready_tissue_paired_atlas.py" \
            --checkpoint "$RUNNER_TEMP/original_tissue/tissue_vae.pt" \
            --records "$RUNNER_TEMP/real_tissue_paired_diagnostic/actual_217_patch_paired_errors.csv" \
            --output "$RUNNER_TEMP/real_tissue_print_plates"
          python chapters/generative_ai_part_i/qa/audit_print_scaled_figures.py \
            "$RUNNER_TEMP/real_tissue_print_plates/actual_tissue_oracle_paired_print_page_1.pdf" \
            "$RUNNER_TEMP/real_tissue_print_plates/actual_tissue_oracle_paired_print_page_2.pdf" \
            --report "$RUNNER_TEMP/real_tissue_print_plates/print_width_preflight.json"
          python - <<'PY'
          import os,json
          from pathlib import Path
          d=Path(os.environ['RUNNER_TEMP'])/'real_tissue_print_plates'
          r=json.loads((d/'print_width_preflight.json').read_text())
          assert r['pass_count']==2 and r['hold_count']==0
          assert all(x['minimum_printed_font_pt']>=7.5 for x in r['results'])
          print('PASS two actual-source page-width original-histology scientific figure plates')
          PY
          python chapters/generative_ai_part_i/qa/verify_pass62_paired_measured_records.py \
            --records "$RUNNER_TEMP/real_tissue_paired_diagnostic/actual_217_patch_paired_errors.csv" \
            --summary "$RUNNER_TEMP/real_tissue_paired_diagnostic/actual_paired_error_summary.json" --independent-rerun
          python - <<'PY'
          import csv,json,os
          from pathlib import Path
          stage=Path(os.environ['RUNNER_TEMP'])/'real_tissue_paired_diagnostic'
          rows=list(csv.DictReader((stage/'actual_217_patch_paired_errors.csv').open()))
          stats=json.loads((stage/'actual_paired_error_summary.json').read_text())
          assert len(rows)==217 and len({(r['source_row'],r['source_col']) for r in rows})==217
          assert stats['source_images']==1
          assert stats['original_test_patches']==217
          assert abs(stats['oracle_nearest_mean_test_mse']-.010597637985416684)<2e-6
          assert stats['vae_lower_mse_count']+stats['oracle_lower_mse_count']==217
          assert 'Oracle' in stats['baseline_warning']
          print('PASS original VAE vs target-aware oracle reference; no claimed independent patients')
          PY

          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'original_tissue_qualitative/actual_tissue_gallery_measured_metrics.json'
          d=json.loads(p.read_text())
          assert d['source_images']==1 and d['spatially_heldout_patches']==217
          assert d['original_source_sha256']=='c5b3ef509a92f16d4c29be8cf0300fe75d53e13a3ce650159db932caea8dcc1b'
          assert 0<d['actual_model_test_PSNR_dB']<100
          assert 0<=d['actual_model_test_SSIM']<=1
          print('PASS original training, checkpoint-driven predictions, source hash, 217 output records and qualitative gallery')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chapter6-executed-real-tissue-original-model-output-gallery
          path: |
            ${{ runner.temp }}/original_tissue
            ${{ runner.temp }}/original_tissue_qualitative
            ${{ runner.temp }}/tissue_vae_architecture
            ${{ runner.temp }}/real_tissue_paired_diagnostic
            ${{ runner.temp }}/real_tissue_print_plates
          retention-days: 90
  original-real-nci-molecule-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install chemistry depiction and original dataset
        run: python -m pip install --disable-pip-version-check 'rdkit>=2024.3,<2027' 'numpy>=1.26,<3' 'scikit-learn>=1.4,<2' 'matplotlib>=3.8,<4' 'pymupdf>=1.24,<2'
      - name: Generate vector figure showing the actual NCI GRU-VAE architecture
        shell: bash
        run: |
          set -euo pipefail
          D=chapters/generative_ai_part_i/code/section_6_molecular_smiles_vae
          python "$D/plot_nci_smiles_vae_code_architecture.py" --output "$RUNNER_TEMP/nci_vae_architecture"
          test -s "$RUNNER_TEMP/nci_vae_architecture/nci_molecular_vae_code_architecture.pdf"
          test -s "$RUNNER_TEMP/nci_vae_architecture/nci_molecular_vae_code_architecture.svg"
          python - <<'PY'
          from pathlib import Path
          import fitz,os
          p=Path(os.environ['RUNNER_TEMP'])/'nci_vae_architecture/nci_molecular_vae_code_architecture.pdf'
          doc=fitz.open(p)
          assert len(doc)==1
          content=doc[0].get_text()
          for label in ('BiGRU encoder','Autoregressive GRU decoder','RDKit chemistry checks'):
              assert label in content,label
          print('PASS original implemented architecture labels and vector publication output')
          PY
      - name: Render original real NCI molecules without generative claims
        shell: bash
        run: |
          set -euo pipefail
          D=chapters/generative_ai_part_i/code/section_6_molecular_smiles_vae
          python "$D/make_original_nci_structure_plate.py"
          test -s "$D/original_nci_chemical_structures.pdf"
          test -s "$D/original_nci_chemical_structures.png"
          test -s "$D/original_nci_chemical_structures.svg"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('chapters/generative_ai_part_i/code/section_6_molecular_smiles_vae/original_nci_molecules_provenance.json')
          m=json.loads(p.read_text())
          assert m['original_file_sha256']=='91e71c015f14939837f2943dcc904f7c87e5a3a0124d82b05c28ad2f23004def'
          assert m['splits']=={'training':360,'validation':120,'test':120}
          assert m['observed_source_structures_not_generations'] is True
          print('PASS authentic original NCI structures; not generated drug candidates')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chapter6-source-verified-original-nci-chemical-structure-plate
          path: |
            chapters/generative_ai_part_i/code/section_6_molecular_smiles_vae/original_nci_chemical_structures.*
            chapters/generative_ai_part_i/code/section_6_molecular_smiles_vae/original_nci_molecules_provenance.json
            ${{ runner.temp }}/nci_vae_architecture
          retention-days: 90

  print-width-original-photo-and-architecture-portfolios:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install authentic dataset, scientific-model and vector-print dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'torch>=2.3,<3' 'scikit-image>=0.22,<0.27' 'scikit-learn>=1.4,<2' 'rdkit>=2024.3,<2027' 'matplotlib>=3.8,<4' 'pymupdf>=1.24,<2'
      - name: Execute actual tissue VAE model on original micrograph
        shell: bash
        run: |
          set -euo pipefail
          D=chapters/generative_ai_part_i/code/section_6_medical_imaging_histology_vae
          python "$D/run.py" --epochs 12 --output "$RUNNER_TEMP/real_tissue_checkpoint"
          test -s "$RUNNER_TEMP/real_tissue_checkpoint/tissue_vae.pt"
      - name: Regenerate seven genuine-image and code-faithful architecture PDFs
        shell: bash
        run: |
          set -euo pipefail
          G=chapters/generative_ai_part_i/figure_generation
          python "$G/print_width_original_image_portfolio.py" \
            --checkpoint "$RUNNER_TEMP/real_tissue_checkpoint/tissue_vae.pt" \
            --output "$RUNNER_TEMP/print_width_portfolio"
          python "$G/print_width_architecture_plates.py" --output "$RUNNER_TEMP/print_width_portfolio"
          python chapters/generative_ai_part_i/qa/validate_pass63_print_figures.py \
            --directory "$RUNNER_TEMP/print_width_portfolio" \
            --report "$RUNNER_TEMP/print_width_portfolio/pass63_text_image_bounds.json"
          for n in tissue_source_compact digits_source_compact nci_source_compact tissue_vae_output_compact_1 tissue_vae_output_compact_2 smiles_vae_architecture_compact tissue_vae_architecture_compact; do
            test -s "$RUNNER_TEMP/print_width_portfolio/$n.pdf"
            test -s "$RUNNER_TEMP/print_width_portfolio/$n.png"
            test -s "$RUNNER_TEMP/print_width_portfolio/$n.svg"
          done
      - name: Reject unreadable and unverified printed scientific plates
        shell: bash
        run: |
          set -euo pipefail
          python chapters/generative_ai_part_i/qa/audit_print_scaled_figures.py \
            "$RUNNER_TEMP/print_width_portfolio/"*.pdf \
            --width-pt 468 --min-font-pt 7.5 \
            --report "$RUNNER_TEMP/print_width_portfolio/print_width_validation.json"
          python - <<'PY'
          from pathlib import Path
          import json,os
          d=Path(os.environ['RUNNER_TEMP'])/'print_width_portfolio'
          report=json.loads((d/'print_width_validation.json').read_text())
          assert report['pass_count']==7 and report['hold_count']==0,report
          assert all(x['minimum_printed_font_pt']>=7.5 for x in report['results'])
          p=json.loads((d/'print_compact_provenance.json').read_text())
          assert p['tissue_original_source_sha256']=='c5b3ef509a92f16d4c29be8cf0300fe75d53e13a3ce650159db932caea8dcc1b'
          assert p['not_full_manuscript_production_approval'] is True
          print('PASS seven genuine-data and source-code architecture print-width plates')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chapter6-pass63-actual-seven-original-data-print-width-figures
          path: |
            ${{ runner.temp }}/print_width_portfolio
          retention-days: 90
