name: Detailed Chapter 2 authentic-data scientific experiments
on:
  push:
    paths:
      - 'chapters/deep_learning/part_i/experiments/detailed_real_digits_pytorch_cnn/**'
      - 'chapters/deep_learning/part_i/experiments/detailed_real_sunspots_gradient/**'
      - '.github/workflows/chapter2_detailed_real_data_science.yml'
  pull_request:
    paths:
      - 'chapters/deep_learning/part_i/experiments/detailed_real_digits_pytorch_cnn/**'
      - 'chapters/deep_learning/part_i/experiments/detailed_real_sunspots_gradient/**'
  workflow_dispatch:
jobs:
  original-data-experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyTorch and numeric libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'scikit-learn>=1.3,<2' 'statsmodels>=0.14,<1' 'matplotlib>=3.8,<4' torch
      - name: Execute actual original-data CNN model and baseline
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '2'
        run: |
          python chapters/deep_learning/part_i/experiments/detailed_real_digits_pytorch_cnn/run.py --out original_data_results/digits_cnn
          python chapters/deep_learning/part_i/experiments/detailed_real_digits_pytorch_cnn/test_outputs.py --out original_data_results/digits_cnn
      - name: Execute actual NGDC observed-sunspot RNN gradient runs
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '2'
        run: |
          python chapters/deep_learning/part_i/experiments/detailed_real_sunspots_gradient/run.py --out original_data_results/recurrent_gradient
          python chapters/deep_learning/part_i/experiments/detailed_real_sunspots_gradient/test_outputs.py --out original_data_results/recurrent_gradient
      - name: Archive actual source-linked measured data and figure assets
        uses: actions/upload-artifact@v4
        with:
          name: detailed-chapter2-authentic-original-digits-sunspots
          path: original_data_results/
          if-no-files-found: error
