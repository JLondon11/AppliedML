name: Chapter 6 scoped original-data Level A/B scientific certificates
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/chapter6_scoped_level_a_certification.yml'
      - 'chapters/generative_ai_part_i/qa/CH6_SCOPED_SCIENTIFIC_VS_PRODUCTION_REGISTER_20261113.csv'
      - 'chapters/generative_ai_part_i/qa/brownlee_original_loo_replay_20261113.csv'
      - 'chapters/generative_ai_part_i/qa/verify_brownlee_independent_loo.py'
      - 'chapters/generative_ai_part_i/qa/validate_scoped_ch6_certifications.py'
      - 'chapters/generative_ai_part_i/code/section_8_8_2_neu_defect_benchmark/paired_seed_science/**'
      - 'chapters/generative_ai_part_i/code/section_8_8_2_neu_defect_benchmark/replicated_seed_metrics_pass13.csv'
      - 'chapters/generative_ai_part_i/code/section_8_8_2_neu_defect_benchmark/test_neu_paired_seed_uncertainty.py'
      - 'chapters/generative_ai_part_i/code/section_8_8_2_neu_defect_benchmark/audit_paired_seed_uncertainty.py'
      - 'chapters/generative_ai_part_i/code/section_6_autonomous_scientific_discovery_nci/retrospective_esol/figures/esol_exact_random_ranking_tail.svg'
      - 'chapters/generative_ai_part_i/code/section_6_autonomous_scientific_discovery_nci/retrospective_esol/plot_exact_random_ranking_tail.js'
      - 'chapters/generative_ai_part_i/code/section_6_autonomous_scientific_discovery_nci/retrospective_esol/exact_random_selection_reference.py'
      - 'chapters/generative_ai_part_i/code/section_6_autonomous_scientific_discovery_nci/retrospective_esol/verified_original_ESOL_random_null.json'
      - 'chapters/generative_ai_part_i/code/section_6_autonomous_scientific_discovery_nci/retrospective_esol/verified_original_ESOL_226_test_predictions.csv'
      - 'chapters/generative_ai_part_i/qa/validate_scoped_csv_schema.py'
      - 'chapters/generative_ai_part_i/qa/test_scoped_csv_schema.py'
      - 'chapters/generative_ai_part_i/code/section_8_8_2_neu_defect_benchmark/plot_original_augmentation_seed_results.py'
      - 'chapters/generative_ai_part_i/code/section_8_8_2_neu_defect_benchmark/plot_neu_paired_accuracy.js'
      - 'chapters/generative_ai_part_i/code/section_8_8_2_neu_defect_benchmark/figures/neu_seed_paired_accuracy.svg'
      - 'chapters/generative_ai_part_i/qa/test_scoped_certification_validator.py'
      - 'chapters/generative_ai_part_i/qa/check_ch6_release_gate.py'
      - 'chapters/generative_ai_part_i/qa/test_ch6_release_gate.py'
      - 'chapters/generative_ai_part_i/qa/verify_ch6_production_inventory.py'
      - 'chapters/generative_ai_part_i/qa/test_ch6_production_inventory.py'
      - 'chapters/generative_ai_part_i/qa/verify_tex_figure_bindings.py'
      - 'chapters/generative_ai_part_i/qa/test_verify_tex_figure_bindings.py'
      - 'chapters/generative_ai_part_i/qa/verify_ch6_parent_science.py'
      - 'chapters/generative_ai_part_i/qa/test_verify_ch6_parent_science.py'
      - 'chapters/generative_ai_part_i/code/section_6_20_1_latent_diffusion_digits/plot_verified_conditioning_pipeline.js'
      - 'chapters/generative_ai_part_i/code/section_6_20_1_latent_diffusion_digits/figure_6_44_class_counts_pass27.csv'
      - 'chapters/generative_ai_part_i/code/section_6_20_1_latent_diffusion_digits/figures/verified_digit_conditioning_science.svg'
      - 'chapters/generative_ai_part_i/code/section_6_20_1_latent_diffusion_digits/audit_real_evaluator_control.py'
      - 'chapters/generative_ai_part_i/code/section_6_20_1_latent_diffusion_digits/compute_sample_uncertainty.py'
      - 'chapters/generative_ai_part_i/code/section_6_20_1_latent_diffusion_digits/verify_original_evaluator_control.py'
      - 'chapters/generative_ai_part_i/code/section_6_20_1_latent_diffusion_digits/plot_real_evaluator_control.js'
      - 'chapters/generative_ai_part_i/code/section_6_20_1_latent_diffusion_digits/original_evaluator_control/**'
      - 'chapters/generative_ai_part_i/quality_assurance/production_inventory.json'
permissions:
  contents: read
jobs:
  independently-execute-original-industrial-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install scientific source dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' 'scikit-learn==1.8.0' 'statsmodels==0.14.6' 'matplotlib>=3.10,<3.12'
      - name: Validate exact scientific-versus-production CSV schema and negative fixtures
        shell: bash
        run: |
          set -euo pipefail
          D=chapters/generative_ai_part_i/qa
          python "$D/validate_scoped_csv_schema.py" --register "$D/CH6_SCOPED_SCIENTIFIC_VS_PRODUCTION_REGISTER_20261113.csv"
          PYTHONPATH="$D" python -m unittest discover -s "$D" -p 'test_scoped_csv_schema.py' -v
      - name: Verify current scoped experiment certificates without extending parent claims
        run: python chapters/generative_ai_part_i/qa/validate_scoped_ch6_certifications.py
      - name: Re-execute actual Brownlee 21-fold model comparisons
        run: python chapters/generative_ai_part_i/qa/verify_brownlee_independent_loo.py --output "$RUNNER_TEMP/ch6_brownlee"
      - name: Validate original observed-source and recorded out-of-fold metrics
        env:
          REPLAY_ROOT: ${{ runner.temp }}/ch6_brownlee
        run: |
          python - <<'PY'
          import json,os,csv
          from pathlib import Path
          d=Path(os.environ['REPLAY_ROOT'])
          m=json.loads((d/'verified_brownlee_metrics.json').read_text())
          assert m['source_sha256']=='d999d98d68f6cd1ad64dec41476b32961a63e60a3e81433bca361601b5612e6d'
          assert m['n_plant_observations']==21
          assert m['nominal_90pct_interval_coverage']=='19/21'
          saved=Path('chapters/generative_ai_part_i/qa/brownlee_original_loo_replay_20261113.csv')
          a=list(csv.DictReader(saved.open()))
          b=list(csv.DictReader((d/'original_brownlee_loo_predictions.csv').open()))
          assert len(a)==len(b)==21
          for x,y in zip(a,b):
              assert x['heldout_id']==y['heldout_id']
              for k in ('observed_stack_loss','gp_predictive_mean','ridge_prediction','training_mean_prediction','gp_p05','gp_p95'):
                  assert abs(float(x[k])-float(y[k]))<1e-6,(k,x['heldout_id'])
          print('PASS real-data Brownlee replay and original source SHA-256')
          PY
      - name: Regenerate original NEU-DET held-out accuracy/F1 graphics from 12 real measured seed records
        shell: bash
        run: |
          set -euo pipefail
          DIR=chapters/generative_ai_part_i/code/section_8_8_2_neu_defect_benchmark
          python "$DIR/plot_original_augmentation_seed_results.py"
          for ext in pdf png svg; do test -s "$DIR/scientific_figure_results/neu_original_real_seed_comparison.$ext"; done
      - name: Execute scoped register and release-gate regression suites
        run: |
          python -m unittest discover -s chapters/generative_ai_part_i/qa -p 'test_scoped_certification_validator.py' -v
          python -m unittest discover -s chapters/generative_ai_part_i/qa -p 'test_ch6_release_gate.py' -v
          python -m unittest discover -s chapters/generative_ai_part_i/qa -p 'test_ch6_production_inventory.py' -v
          python -m unittest discover -s chapters/generative_ai_part_i/qa -p 'test_verify_tex_figure_bindings.py' -v
          python -m unittest discover -s chapters/generative_ai_part_i/qa -p 'test_verify_ch6_parent_science.py' -v
      - name: Regenerate source-linked NEU paired accuracy SVG and reject figure drift
        shell: bash
        run: |
          set -euo pipefail
          DIR=chapters/generative_ai_part_i/code/section_8_8_2_neu_defect_benchmark
          node "$DIR/plot_neu_paired_accuracy.js"
          git diff --exit-code -- "$DIR/figures/neu_seed_paired_accuracy.svg"
      - name: Regenerate original-digit latent conditioning figure and prevent evidence drift
        shell: bash
        run: |
          set -euo pipefail
          DIR=chapters/generative_ai_part_i/code/section_6_20_1_latent_diffusion_digits
          node "$DIR/plot_verified_conditioning_pipeline.js"
          git diff --exit-code -- "$DIR/figures/verified_digit_conditioning_science.svg"
      - name: Independently execute original real-image evaluator and verify saved class results
        shell: bash
        run: |
          set -euo pipefail
          DIR=chapters/generative_ai_part_i/code/section_6_20_1_latent_diffusion_digits
          python "$DIR/audit_real_evaluator_control.py" --counts "$DIR/figure_6_44_class_counts_pass27.csv" --out "$RUNNER_TEMP/ch6_digit_evaluator"
          python "$DIR/verify_original_evaluator_control.py"
          python - <<'PY'
          import csv,json,os
          from pathlib import Path
          d=Path(os.environ['RUNNER_TEMP'])/'ch6_digit_evaluator'
          base=Path('chapters/generative_ai_part_i/code/section_6_20_1_latent_diffusion_digits/original_evaluator_control')
          actual=json.loads((d/'metrics.json').read_text())
          saved=json.loads((base/'metrics.json').read_text())
          for key in ('original_test_index_sha256','real_evaluator_correct','real_evaluator_test_n','recorded_conditional_agreement','recorded_unconditional_comparison_agreement'):
              assert actual[key]==saved[key],(key,actual[key],saved[key])
          for f in ('real_evaluator_vs_generated_class.csv','real_evaluator_confusion.csv'):
              a=list(csv.DictReader((d/f).open(newline='')))
              b=list(csv.DictReader((base/f).open(newline='')))
              assert len(a)==len(b),(f,len(a),len(b))
              for i,(x,y) in enumerate(zip(a,b)):
                  assert x.keys()==y.keys()
                  for k in x:
                      if x[k]==y[k]:continue
                      assert abs(float(x[k])-float(y[k]))<1e-12,(f,i,k,x[k],y[k])
          print('PASS: independently trained real-digit evaluator and committed numeric records agree')
          PY
          node "$DIR/plot_real_evaluator_control.js"
          git diff --exit-code -- "$DIR/original_evaluator_control/real_classifier_control_summary.svg"
      - name: Verify original-data evaluator sample uncertainty and limited claim scope
        shell: bash
        run: |
          set -euo pipefail
          DIR=chapters/generative_ai_part_i/code/section_6_20_1_latent_diffusion_digits
          python "$DIR/compute_sample_uncertainty.py"
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path("chapters/generative_ai_part_i/code/section_6_20_1_latent_diffusion_digits/original_evaluator_control/sample_uncertainty.json")
          s=json.loads(f.read_text(encoding="utf-8"))
          assert s["real_test"]["correct"] == 257 and s["real_test"]["n"] == 270
          assert s["conditional_generated"]["classifier_agree"] == 778
          assert len(s["per_digit"]) == 10 and len(s["limitations"]) >= 4
          print("PASS: computed conditional-sample intervals; generator-seed uncertainty not claimed")
          PY
      - name: Re-evaluate exact random-ranking reference from original measured ESOL assays
        shell: bash
        run: |
          set -euo pipefail
          DIR=chapters/generative_ai_part_i/code/section_6_autonomous_scientific_discovery_nci/retrospective_esol
          python "$DIR/exact_random_selection_reference.py" --csv "$DIR/verified_original_ESOL_226_test_predictions.csv" --out "$RUNNER_TEMP/esol_exact_null.json"
          python - <<'PY'
          import json,math,os
          from pathlib import Path
          dir=Path("chapters/generative_ai_part_i/code/section_6_autonomous_scientific_discovery_nci/retrospective_esol")
          a=json.loads((Path(os.environ["RUNNER_TEMP"])/"esol_exact_null.json").read_text())
          b=json.loads((dir/"verified_original_ESOL_random_null.json").read_text())
          for key in ("n_original_heldout_assays","observed_high_solubility_assays",
                      "random_selection_n","random_selection_central_95pct_hits"):
              assert a[key]==b[key], (key,a[key],b[key])
          for method in ("ridge","published_ESOL"):
              for key in ("measured_hits_top20","precision_top20",
                          "fold_enrichment_over_random","exact_uniform_random_upper_tail_probability",
                          "measured_test_rmse_log_mol_L"):
                  assert math.isclose(a["model_arms"][method][key],
                       b["model_arms"][method][key],rel_tol=1e-9,abs_tol=1e-12),(method,key)
          print("PASS: original ESOL exact finite-population random null; no prospective discovery claim")
          PY
      - name: Verify genuine measured ESOL exact random-null and scientific graphic
        shell: bash
        run: |
          set -euo pipefail
          DIR=chapters/generative_ai_part_i/code/section_6_autonomous_scientific_discovery_nci/retrospective_esol
          python "$DIR/exact_random_selection_reference.py" --csv "$DIR/verified_original_ESOL_226_test_predictions.csv" --out "$RUNNER_TEMP/ch6_esol_null.json"
          python - <<'PY'
          import json, math, os
          from pathlib import Path
          d=Path("chapters/generative_ai_part_i/code/section_6_autonomous_scientific_discovery_nci/retrospective_esol")
          a=json.loads((Path(os.environ["RUNNER_TEMP"])/"ch6_esol_null.json").read_text())
          b=json.loads((d/"verified_original_ESOL_random_null.json").read_text())
          for key in ("n_original_heldout_assays","observed_high_solubility_assays","random_selection_n","random_selection_central_95pct_hits"):
              assert a[key]==b[key],key
          for model in ("ridge","published_ESOL"):
              for key in ("measured_hits_top20","precision_top20","fold_enrichment_over_random","exact_uniform_random_upper_tail_probability","measured_test_rmse_log_mol_L"):
                  assert math.isclose(a["model_arms"][model][key],b["model_arms"][model][key],rel_tol=1e-9,abs_tol=1e-12),(model,key)
          print("PASS authentic ESOL null, limited to previously observed assays")
          PY
          node "$DIR/plot_exact_random_ranking_tail.js"
          git diff --exit-code -- "$DIR/figures/esol_exact_random_ranking_tail.svg"
      - name: Report missing full parent-application science without silently treating scoped demos as certified parents
        shell: bash
        run: |
          set -euo pipefail
          if python chapters/generative_ai_part_i/qa/verify_ch6_parent_science.py --repo-root . > "$RUNNER_TEMP/ch6_parent_science.json"; then
            echo "Parent evidence records structurally complete; independent scientific review still mandatory"
          else
            echo "Full parent certification blocked pending true task-matched original data and actual manuscript"
            cat "$RUNNER_TEMP/ch6_parent_science.json"
          fi
      - name: Independently re-evaluate original NEU GAN matched-seed scientific effects
        shell: bash
        run: |
          set -euo pipefail
          DIR=chapters/generative_ai_part_i/code/section_8_8_2_neu_defect_benchmark
          python -m unittest discover -s "$DIR" -p 'test_neu_paired_seed_uncertainty.py' -v
          python "$DIR/audit_paired_seed_uncertainty.py" --csv "$DIR/replicated_seed_metrics_pass13.csv" --out "$RUNNER_TEMP/ch6_neu_paired"
          python - <<'PY'
          import csv,json,math,os,hashlib
          from pathlib import Path
          import xml.etree.ElementTree as ET
          base=Path('chapters/generative_ai_part_i/code/section_8_8_2_neu_defect_benchmark')
          assert hashlib.sha256((base/'replicated_seed_metrics_pass13.csv').read_bytes()).hexdigest()=='1f74ab0c8067612a072c2eff5554b971682ce851bd4c7ca5eb585fbb5f163d9e'
          executed=Path(os.environ['RUNNER_TEMP'])/'ch6_neu_paired'
          expected=json.loads((base/'paired_seed_science/paired_seed_statistics.json').read_text())
          actual=json.loads((executed/'paired_seed_statistics.json').read_text())
          assert actual['source_rows']==expected['source_rows']==12
          for metric in ('test_accuracy','test_macro_f1'):
              for baseline in ('real_only','real_repeat_augmented'):
                  a=actual['metrics'][metric][baseline]
                  b=expected['metrics'][metric][baseline]
                  for key in ('mean_difference','between_seed_sample_sd','one_sided_exact_sign_test_tail'):
                      assert math.isclose(a[key],b[key],abs_tol=1e-12),(metric,baseline,key)
                  assert a['negative_difference_seeds']==3 and a['one_sided_exact_sign_test_tail']==0.125
          assert len(list(csv.DictReader((executed/'paired_seed_effects.csv').open())))==12
          tree=ET.parse(executed/'paired_seed_effects.svg')
          assert tree.getroot().tag.endswith('svg')
          print('PASS real NEU original-data paired effects, source SHA and limited n=3 inference')
          PY
      - name: Assert Chapter 6 full release remains structurally blocked without manuscript
        shell: bash
        run: |
          set -euo pipefail
          if python chapters/generative_ai_part_i/qa/check_ch6_release_gate.py --repo-root . > "$RUNNER_TEMP/ch6_release_status.json"; then
            echo "Structural gate passed; full scientific/manual production review still required"
          else
            echo "Production gate correctly reports remaining blockers"
            cat "$RUNNER_TEMP/ch6_release_status.json"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: chapter6-original-brownlee-independent-21fold-replay
          path: ${{ runner.temp }}/ch6_brownlee
          retention-days: 90
