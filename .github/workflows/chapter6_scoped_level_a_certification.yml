name: Chapter 6 scoped original-data Level A scientific certificates
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/chapter6_scoped_level_a_certification.yml'
      - 'chapters/generative_ai_part_i/qa/CH6_SCOPED_SCIENTIFIC_VS_PRODUCTION_REGISTER_20261113.csv'
      - 'chapters/generative_ai_part_i/qa/brownlee_original_loo_replay_20261113.csv'
      - 'chapters/generative_ai_part_i/qa/verify_brownlee_independent_loo.py'
      - 'chapters/generative_ai_part_i/qa/validate_scoped_ch6_certifications.py'
permissions:
  contents: read
jobs:
  independently-execute-original-industrial-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install scientific source dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.3.5' 'pandas==2.2.3' 'scipy==1.17.0' 'scikit-learn==1.8.0' 'statsmodels==0.14.6'
      - name: Verify three genuine experiment certificates without extending parent claims
        run: python chapters/generative_ai_part_i/qa/validate_scoped_ch6_certifications.py
      - name: Re-execute actual Brownlee 21-fold model comparisons
        run: python chapters/generative_ai_part_i/qa/verify_brownlee_independent_loo.py --output "$RUNNER_TEMP/ch6_brownlee"
      - name: Validate original observed-source and recorded out-of-fold metrics
        env:
          REPLAY_ROOT: ${{ runner.temp }}/ch6_brownlee
        run: |
          python - <<'PY'
          import json,os,csv
          from pathlib import Path
          d=Path(os.environ['REPLAY_ROOT'])
          m=json.loads((d/'verified_brownlee_metrics.json').read_text())
          assert m['source_sha256']=='d999d98d68f6cd1ad64dec41476b32961a63e60a3e81433bca361601b5612e6d'
          assert m['n_plant_observations']==21
          assert m['nominal_90pct_interval_coverage']=='19/21'
          saved=Path('chapters/generative_ai_part_i/qa/brownlee_original_loo_replay_20261113.csv')
          a=list(csv.DictReader(saved.open()))
          b=list(csv.DictReader((d/'original_brownlee_loo_predictions.csv').open()))
          assert len(a)==len(b)==21
          for x,y in zip(a,b):
              assert x['heldout_id']==y['heldout_id']
              for k in ('observed_stack_loss','gp_predictive_mean','ridge_prediction','training_mean_prediction','gp_p05','gp_p95'):
                  assert abs(float(x[k])-float(y[k]))<1e-6,(k,x['heldout_id'])
          print('PASS real-data Brownlee replay and original source SHA-256')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chapter6-original-brownlee-independent-21fold-replay
          path: ${{ runner.temp }}/ch6_brownlee
          retention-days: 90
