name: Chapter 5 — KITTI original multimodal calibration inspection
on:
  workflow_dispatch:
  push:
    branches:
      - chapter5-cpu-sam-validation-20261105
    paths:
      - .github/workflows/chapter5-kitti-fusion-input-audit.yml
      - chapters/computer_vision/part_ii/autonomous_vehicles/experiments/kitti_fusion_cpu/inspect_calibration.py
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy opencv-python-headless
      - run: python chapters/computer_vision/part_ii/autonomous_vehicles/experiments/kitti_fusion_cpu/inspect_calibration.py
