name: Regenerate remediated scientific figures

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/regenerate_remediated_scientific_figures.yml'
      - 'chapters/nlp_part_ii/tokenization_and_representation/figure_04_embedding_geometry/figure_04_embedding_geometry.py'
      - 'chapters/nlp_part_ii/interpretability/figure_06_attention_head_specialization/figure_06_attention_head_specialization.py'
      - 'chapters/nlp_part_ii/case_studies/enterprise_rag/figure_12_hallucination_comparison/figure_12_hallucination_reduction_rag.py'
      - 'chapters/scientific_ai/ophthalmology/figure_14_gradcam_retinal_application/figure_14_gradcam_retinal.py'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scientific dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas matplotlib scikit-learn torch torchvision transformers huggingface_hub medmnist

      - name: Regenerate NLP II Figure 3
        run: python chapters/nlp_part_ii/tokenization_and_representation/figure_03_bpe/figure_03_bpe.py

      - name: Regenerate NLP II Figure 4
        run: python chapters/nlp_part_ii/tokenization_and_representation/figure_04_embedding_geometry/figure_04_embedding_geometry.py

      - name: Regenerate NLP II Figure 6
        run: python chapters/nlp_part_ii/interpretability/figure_06_attention_head_specialization/figure_06_attention_head_specialization.py

      - name: Regenerate NLP II Figure 10
        run: python chapters/nlp_part_ii/case_studies/enterprise_rag/figure_10_architecture/figure_10_enterprise_rag_architecture.py

      - name: Regenerate NLP II Figure 12
        run: python chapters/nlp_part_ii/case_studies/enterprise_rag/figure_12_hallucination_comparison/figure_12_hallucination_reduction_rag.py

      - name: Regenerate Scientific AI Figure 14
        run: python chapters/scientific_ai/ophthalmology/figure_14_gradcam_retinal_application/figure_14_gradcam_retinal.py

      - name: Run duplicate-figure audit
        run: python tools/audit_duplicate_figures.py

      - name: Commit regenerated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chapters/nlp_part_ii chapters/scientific_ai book/qa
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Regenerate remediated scientific figures"
            git pull --rebase origin main
            git push origin main
          fi
