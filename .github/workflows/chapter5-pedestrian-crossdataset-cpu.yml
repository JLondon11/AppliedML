name: Chapter 5 — Genuine paired pedestrian cross-dataset CPU experiment
on:
  workflow_dispatch:
  push:
    branches:
      - chapter5-cpu-sam-validation-20261105
    paths:
      - .github/workflows/chapter5-pedestrian-crossdataset-cpu.yml
      - chapters/computer_vision/part_ii/autonomous_vehicles/experiments/pedestrian_cross_dataset_cpu/**
permissions:
  contents: read
jobs:
  cross-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install huggingface_hub opencv-python-headless numpy matplotlib Pillow
      - name: Obtain original CrowdHuman images and actual pretrained model
        run: |
          python chapters/computer_vision/part_ii/autonomous_vehicles/experiments/crowdhuman_cpu/prepare.py \
            --out "${{ runner.temp }}/crowdhuman" --images 24 --seed 20261106
      - name: Execute same pretrained detector on Penn-Fudan and CrowdHuman
        run: |
          python chapters/computer_vision/part_ii/autonomous_vehicles/experiments/pedestrian_cross_dataset_cpu/evaluate.py \
            --crowd-images "${{ runner.temp }}/crowdhuman/images" \
            --crowd-annotations "${{ runner.temp }}/crowdhuman/subset.odgt" \
            --checkpoint "${{ runner.temp }}/crowdhuman/fasterrcnn_resnet50_fpn_coco_state_dict.pth" \
            --scratch "${{ runner.temp }}/pennfudan" \
            --output cross_dataset_results \
            --images 24 --confidence 0.30
      - name: Archive only derived metric evidence and scientific figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter5-pennfudan-crowdhuman-matched-detector-evidence
          path: cross_dataset_results/
          if-no-files-found: warn
          retention-days: 30
