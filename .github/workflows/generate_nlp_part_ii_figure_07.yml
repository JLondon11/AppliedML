name: Generate NLP Part II Figure 7
on:
  push:
    paths:
      - "chapters/nlp_part_ii/case_studies/bert_imdb_sentiment/figure_07_architecture/figure_07_bert_sentiment_architecture.py"
      - ".github/workflows/generate_nlp_part_ii_figure_07.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.2,<3" "transformers>=4.44,<5" "huggingface_hub>=0.24,<1" "matplotlib>=3.8,<4"
      - run: python chapters/nlp_part_ii/case_studies/bert_imdb_sentiment/figure_07_architecture/figure_07_bert_sentiment_architecture.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chapters/nlp_part_ii/case_studies/bert_imdb_sentiment/figure_07_architecture/
          if git diff --cached --quiet; then echo "No generated changes."; else git commit -m "Generate NLP Part II Figure 7 from BERT-base"; git push; fi